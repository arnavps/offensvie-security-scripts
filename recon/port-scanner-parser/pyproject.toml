[tool.poetry]
name = "recon-analyzer"
version = "0.1.0"
description = "Professional Port Scanner Parser & Recon Analysis Toolkit"
authors = ["Offensive Security Engineer"]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.9.0"
pydantic = "^2.0.0"
defusedxml = "^0.7.1"
loguru = "^0.7.0"
jinja2 = "^3.1.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
recon = "recon_analyzer.cli:app"
